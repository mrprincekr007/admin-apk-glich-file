<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN LOGIN</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        *,
        *::before,
        *::after {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }
        :focus { outline: none; }

        body {
            font-family: 'Segoe UI', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0f1e;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(99, 102, 241, 0.15), transparent 45%),
                        radial-gradient(circle at 70% 70%, rgba(236, 72, 153, 0.12), transparent 45%);
            animation: drift 18s linear infinite;
            z-index: 0;
        }

        @keyframes drift {
            0% { transform: translate(0, 0); }
            50% { transform: translate(3%, -2%); }
            100% { transform: translate(0, 0); }
        }

        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 22px;
            padding: 40px 32px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .logo {
            width: 58px;
            height: 58px;
            margin: 0 auto 16px;
            border-radius: 16px;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
        }

        h1 {
            font-size: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .sub {
            color: #94a3b8;
            font-size: 12px;
            margin-bottom: 26px;
        }

        label {
            display: block;
            text-align: left;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 14px;
            margin-bottom: 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            color: #fff;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
        }

        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .error-msg {
            display: none;
            color: #f87171;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 14px;
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
            "firebase/analytics": "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
            "firebase/database": "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"
        }
    }
    </script>
</head>
<body>

    <div class="login-card">
        <div class="logo">🛡️</div>
        <h1>Admin Panel</h1>
        <div class="sub">PRINCE HACKS • Secure Admin Access</div>

        <div class="error-msg" id="errorMsg">Invalid email or password!</div>

        <form id="loginForm">
            <label>Email</label>
            <input type="email" id="emailInput" placeholder="admin@example.com" autocomplete="email">

            <label>Password</label>
            <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password">

            <button type="submit" class="btn" id="loginBtn">LOGIN</button>
        </form>
    </div>

    <script type="module">
        import { auth } from "./firebase-config.js";
        import { signInWithEmailAndPassword } from "firebase/auth";

        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const email = document.getElementById("emailInput").value.trim();
            const password = document.getElementById("passwordInput").value;
            const errorMsg = document.getElementById("errorMsg");
            const loginBtn = document.getElementById("loginBtn");

            loginBtn.disabled = true;
            loginBtn.innerText = "LOGGING IN...";

            signInWithEmailAndPassword(auth, email, password)
                .then(function() {
                    sessionStorage.setItem("adminLoggedIn", "true");
                    window.location.href = "dashboard.html";
                })
                .catch(function() {
                    errorMsg.style.display = "block";
                    loginBtn.disabled = false;
                    loginBtn.innerText = "LOGIN";
                });
        });
    </script>
</body>
</html>
