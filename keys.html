<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USER KEYS - ADMIN PANEL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        *,
        *::before,
        *::after {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }
        :focus { outline: none; }

        :root {
            --bg: #0a0f1e;
            --panel: #111827;
            --panel-2: #1a2234;
            --border: rgba(99, 102, 241, 0.18);
            --accent: #6366f1;
            --accent-2: #ec4899;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --green: #10b981;
            --red: #ef4444;
        }

        body {
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .sidebar {
            width: 230px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            padding: 20px 14px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 10;
        }

        .sidebar .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 10px 18px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 14px;
        }

        .sidebar .logo .icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .sidebar .logo .name {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .sidebar .logo .role {
            font-size: 10px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 12px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 4px;
            user-select: none;
        }

        .nav-item:hover { background: var(--panel-2); color: var(--text); }
        .nav-item.active {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(236, 72, 153, 0.2));
            color: #fff;
            border: 1px solid var(--border);
        }

        .nav-item .ic { font-size: 16px; width: 22px; text-align: center; }
        .nav-item .nav-arrow { margin-left: auto; font-size: 10px; transition: transform 0.25s; }
        .nav-item.open .nav-arrow { transform: rotate(180deg); }
        .nav-sub { display: none; padding: 2px 0 6px 0; }
        .nav-item.open + .nav-sub { display: block; }
        .nav-sub-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px 9px 40px;
            border-radius: 10px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 2px;
            transition: all 0.2s;
            user-select: none;
        }
        .nav-sub-item:hover { background: var(--panel-2); color: var(--text); }
        .nav-sub-item.active { background: rgba(99, 102, 241, 0.2); color: #fff; border: 1px solid var(--border); }

        .svg-ic { display: inline-block; vertical-align: middle; flex-shrink: 0; pointer-events: none; }
        .nav-sub-item .svg-ic { margin-right: 2px; }
        .btn .svg-ic { margin-right: 6px; }

        .nav-item[data-view="overview"] .ic, .m-item[data-view="overview"] .ic { color: #818cf8; }
        .nav-item[data-view="keys"] .ic, .m-item[data-view="keys"] .ic { color: #fbbf24; }
        .nav-item[data-view="categories"] .ic, .m-item[data-view="categories"] .ic { color: #fb923c; }
        .nav-item[data-view="posts"] .ic, .m-item[data-view="posts"] .ic { color: #c084fc; }
        .nav-item[data-view="settings"] .ic, .m-item[data-view="settings"] .ic { color: #38bdf8; }
        .nav-sub-item:nth-child(1) .svg-ic { color: #38bdf8; }
        .nav-sub-item:nth-child(2) .svg-ic { color: #c084fc; }
        .nav-sub-item:nth-child(3) .svg-ic { color: #34d399; }

        .sidebar .logout {
            margin-top: auto;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--red);
            border-radius: 12px;
            padding: 12px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .sidebar .logout:hover { background: rgba(239, 68, 68, 0.2); }

        .main {
            margin-left: 230px;
            padding: 24px;
            min-height: 100vh;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .topbar h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .topbar .user-chip {
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 9px 16px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .topbar-exit {
            display: none;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--red);
            border-radius: 12px;
            padding: 9px 14px;
            font-weight: 800;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .topbar-exit:hover { background: rgba(239, 68, 68, 0.2); }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .card h3 {
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
            color: #fff;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        input[type="text"], input[type="url"], input[type="password"], input[type="number"], input[type="datetime-local"], select, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.35);
            color: var(--text);
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        .field-hint {
            margin-top: 6px;
            font-size: 11px;
            color: #8a85b0;
            line-height: 1.4;
        }

        .field-hint b { color: #ff0080; font-weight: 700; }

        .custom-select {
            position: relative;
            width: 100%;
        }

        .cs-trigger {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 13px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.35);
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .cs-trigger:hover { border-color: rgba(99, 102, 241, 0.5); }

        .cs-trigger .cs-value {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .cs-trigger .cs-arrow {
            color: var(--accent);
            font-size: 14px;
            transition: transform 0.2s;
        }

        .custom-select.open .cs-trigger {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .custom-select.open .cs-arrow {
            transform: rotate(180deg);
        }

        .cs-menu {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 6px;
            z-index: 30;
            max-height: 260px;
            overflow-y: auto;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5);
        }

        .custom-select.open .cs-menu {
            display: block;
            animation: csIn 0.18s ease-out;
        }

        .custom-select.open { z-index: 60; }
        .card:has(.custom-select.open) { position: relative; z-index: 6; }

        @keyframes csIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cs-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            transition: all 0.15s;
            border: 1px solid transparent;
        }

        .cs-option:hover { background: rgba(99, 102, 241, 0.12); }
        .cs-option.selected {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(236, 72, 153, 0.2));
            border-color: var(--border);
            color: #fff;
        }

        .cs-option .cs-opt-icon { font-size: 16px; width: 22px; text-align: center; }
        .cs-option .cs-opt-name { flex: 1; }
        .cs-option .cs-opt-check { color: var(--green); font-weight: 900; }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-green { background: rgba(5, 150, 105, 0.25); color: #6ee7b7; border: 1px solid rgba(52, 211, 153, 0.4); box-shadow: 0 6px 16px -6px rgba(16, 185, 129, 0.4); }
        .btn-red { background: rgba(220, 38, 38, 0.25); color: #fca5a5; border: 1px solid rgba(248, 113, 113, 0.4); box-shadow: 0 6px 16px -6px rgba(220, 38, 38, 0.4); }
        .btn-small { padding: 8px 14px; font-size: 11px; }

        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: var(--panel-2);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 8px;
        }

        .list-item .info {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .list-item .info .thumb {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .list-item .info .t1 { font-size: 13px; font-weight: 700; color: #fff; }
        .list-item .info .t2 { font-size: 11px; color: var(--muted); }

        .actions { display: flex; gap: 8px; }

        .key-status {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .key-status.key-good {
            color: var(--green);
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .key-status.key-bad {
            color: var(--red);
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .key-expiry { color: var(--muted); font-size: 11px; margin-top: 2px; }

        .key-countdown {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #fcd34d;
            background: rgba(251, 191, 36, 0.12);
            border: 1px solid rgba(251, 191, 36, 0.3);
            padding: 3px 10px;
            border-radius: 20px;
        }

        @media (max-width: 700px) {
            .key-expiry { display: none; }
        }

        .empty-state {
            color: var(--muted);
            font-size: 13px;
            text-align: center;
            padding: 30px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 50;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.show { display: flex; }

        .modal {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 24px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal h3 {
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            display: none;
            align-items: center;
            gap: 10px;
            max-width: 92vw;
            padding: 13px 22px;
            border-radius: 14px;
            background: rgba(15, 23, 42, 0.97);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.4;
            text-align: center;
            border: 1px solid rgba(52, 211, 153, 0.45);
            box-shadow: 0 16px 44px rgba(0, 0, 0, 0.55);
            z-index: 9999;
        }
        .toast::before {
            content: '✔';
            color: #34d399;
            font-size: 15px;
            line-height: 1;
            flex-shrink: 0;
        }
        .toast.error {
            background: rgba(51, 15, 22, 0.97);
            border-color: rgba(248, 113, 113, 0.5);
        }
        .toast.error::before {
            content: '✖';
            color: #f87171;
        }
        @media (max-width: 700px) {
            .toast {
                bottom: calc(90px + env(safe-area-inset-bottom, 0px));
                font-size: 13.5px;
                padding: 12px 18px;
            }
        }

        .mobile-nav {
            display: none;
        }

        @media (max-width: 900px) {
            .sidebar { width: 72px; padding: 14px 8px; }
            .sidebar .logo .name, .sidebar .logo .role, .nav-item span.txt { display: none; }
            .nav-item { justify-content: center; }
            .nav-item .ic { width: auto; font-size: 18px; }
            .sidebar .logout { font-size: 11px; padding: 10px 4px; }
            .main { margin-left: 72px; padding: 16px; }
            .topbar-exit { display: block; }
        }

        @media (max-width: 700px) {
            .sidebar { display: none; }
            .main { margin-left: 0; padding: 14px 12px 120px; }
            .mobile-nav {
                display: flex;
                position: fixed;
                bottom: calc(14px + env(safe-area-inset-bottom, 0px));
                left: 14px;
                right: 14px;
                padding: 6px 8px;
                background: rgba(22, 28, 46, 0.97);
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: 28px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
                z-index: 40;
                justify-content: space-around;
            }

            .mobile-nav .m-item {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 4px;
                flex: 1;
                max-width: 84px;
                padding: 7px 6px 6px;
                border-radius: 18px;
                font-size: 9.5px;
                font-weight: 700;
                color: var(--muted);
                cursor: pointer;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                user-select: none;
                transition: all 0.25s ease;
                -webkit-tap-highlight-color: transparent;
            }

            .mobile-nav .m-item .ic {
                font-size: 20px;
                line-height: 1;
                filter: grayscale(0.5) brightness(0.85);
                transition: all 0.25s ease;
            }

            .mobile-nav .m-item.active {
                color: #fff;
                background: linear-gradient(135deg, #6366f1, #ec4899);
                box-shadow: 0 6px 16px -2px rgba(99, 102, 241, 0.5), 0 2px 6px -1px rgba(236, 72, 153, 0.4);
            }

            .mobile-nav .m-item.active .ic {
                filter: none;
                transform: scale(1.08);
            }

            .mobile-nav .m-item:active { transform: scale(0.94); }

            .topbar { margin-bottom: 16px; }
            .topbar h1 { font-size: 16px; }
            .topbar .user-chip { padding: 7px 12px; font-size: 11px; max-width: 45%; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .topbar-exit { display: block; padding: 7px 12px; font-size: 10px; }

            .card { padding: 14px; }
            .card > .btn { width: 100%; padding: 14px; font-size: 13px; }
            .form-row { grid-template-columns: 1fr; }
            .list-item { flex-wrap: wrap; padding: 10px 12px; gap: 10px; }
            .list-item .info { width: 100%; align-items: flex-start; }
            .list-item .info .thumb { width: 38px; height: 38px; }
            .list-item .info .t1 { font-size: 14px; }
            .key-meta { gap: 6px !important; }
            .key-countdown { font-size: 11px; font-weight: 700; padding: 3px 10px; }
            .key-devices { display: flex; flex-wrap: wrap; gap: 6px; }
            .actions { display: flex; width: 100%; justify-content: space-between; }
            .actions .btn { flex: 1; padding: 10px 8px; font-size: 12px; }
        }

        /* ==== UI ENHANCEMENTS: glow / glass / animation / touch ==== */
        body {
            background: #0a0f1e;
        }
        @keyframes bgShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body::before, body::after {
            content: '';
            position: fixed;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            opacity: 0.16;
            z-index: 0;
            pointer-events: none;
        }
        body::before {
            top: -140px; left: -140px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.55), transparent 70%);
        }
        body::after {
            bottom: -160px; right: -120px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.55), transparent 70%);
        }
        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(60px, 40px) scale(1.15); }
        }
        @keyframes orbFloat2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-50px, -50px) scale(1.1); }
        }

        @media (max-width: 700px) { body::before, body::after { display: none; } }
        .main { position: relative; z-index: 1; }

        .sidebar {
            background: #111827;
            box-shadow: 2px 0 24px rgba(0, 0, 0, 0.3);
        }

        .sidebar .logo .icon {
            box-shadow: 0 0 22px rgba(99, 102, 241, 0.55);
            animation: iconPulse 3s ease-in-out infinite;
        }
        @keyframes iconPulse {
            0%, 100% { box-shadow: 0 0 18px rgba(99, 102, 241, 0.45); }
            50% { box-shadow: 0 0 30px rgba(236, 72, 153, 0.6); }
        }

        .nav-item {
            position: relative;
            overflow: hidden;
            transition: all 0.25s ease;
        }
        .nav-item:hover { transform: translateX(4px); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25); }
        .nav-item.active {
            box-shadow: 0 4px 18px -2px rgba(99, 102, 241, 0.5);
            animation: navGlow 2.5s ease-in-out infinite;
        }
        @keyframes navGlow {
            0%, 100% { box-shadow: 0 4px 18px -2px rgba(99, 102, 241, 0.45); }
            50% { box-shadow: 0 4px 26px -2px rgba(236, 72, 153, 0.55); }
        }
        .nav-item:active { transform: scale(0.97); }

        .sidebar .logout { transition: all 0.25s ease; }
        .sidebar .logout:hover { transform: translateY(-1px); box-shadow: 0 6px 18px -4px rgba(239, 68, 68, 0.5); }
        .sidebar .logout:active { transform: scale(0.97); }

        .card {
            background: rgba(17, 24, 39, 0.97);
            border: 1px solid rgba(99, 102, 241, 0.22);
            box-shadow: 0 18px 40px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            animation: rise 0.45s ease both;
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn { transition: all 0.25s ease; }
        .btn:not(.btn-red):not(.btn-green):not(.btn-ghost) {
            background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
            background-size: 200% 200%;
            animation: btnShift 6s ease infinite;
            box-shadow: 0 10px 26px -8px rgba(99, 102, 241, 0.7);
        }
        @keyframes btnShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .btn:hover { filter: brightness(1.12); transform: translateY(-2px); }
        .btn:not(.btn-red):not(.btn-green):not(.btn-ghost):hover { box-shadow: 0 14px 32px -8px rgba(99, 102, 241, 0.9); }

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { onAuthStateChanged, signOut } from "firebase/auth";
        import { ref, get, set, update, remove } from "firebase/database";

        window.auth = auth;
        window.db = db;
        window.signOut = signOut;
        window.ref = ref;
        window.get = get;
        window.set = set;
        window.update = update;
        window.remove = remove;

        function applyAdminChip() {
            const el = document.getElementById("adminEmail");
            const isMobile = window.matchMedia("(max-width: 900px)").matches || window.matchMedia("(pointer: coarse)").matches;
            el.innerText = isMobile ? "Admin" : (window.adminEmailAddr || "");
        }
        window.applyAdminChip = applyAdminChip;
        window.addEventListener("resize", applyAdminChip);

        onAuthStateChanged(auth, function(user) {
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            const loginTime = parseInt(localStorage.getItem("adminLoginTime") || "0", 10);
            if (!loginTime) {
                localStorage.setItem("adminLoginTime", String(Date.now()));
            } else if (Date.now() - loginTime > 24 * 60 * 60 * 1000) {
                signOut(auth).then(function() {
                    sessionStorage.removeItem("adminLoggedIn");
                    localStorage.removeItem("adminLoginTime");
                    window.location.href = "index.html";
                });
                return;
            }
            window.adminEmailAddr = user.email;
            applyAdminChip();
            loadKeys();
        });

        document.getElementById("logoutBtn").addEventListener("click", function() {
            signOut(auth).then(function() {
                sessionStorage.removeItem("adminLoggedIn");
                window.location.href = "index.html";
            });
        });

        document.querySelectorAll(".nav-item, .m-item").forEach(function(item) {
            item.addEventListener("click", function() {
                var view = item.dataset.view;
                if (view === "logout") {
                    document.getElementById("logoutBtn").click();
                    return;
                }
                if (view === "keys") return;
                if (view === "categories") {
                    window.location.href = "categories.html";
                    return;
                }
                if (view === "posts") {
                    window.location.href = "posts.html";
                    return;
                }
                if (view === "settings") {
                    if (item.classList.contains("m-item")) {
                        window.location.href = "settings.html";
                        return;
                    }
                    item.classList.toggle("open");
                    return;
                }
                window.location.href = "dashboard.html?view=" + view;
            });
        });

        function showToast(msg, isError) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.className = "toast" + (isError ? " error" : "");
            toast.style.display = "flex";
            toast.style.animation = "none";
            void toast.offsetWidth;
            toast.style.animation = "";
            setTimeout(function() { toast.style.display = "none"; }, 2600);
        }
        window.showToast = showToast;

        function esc(s) {
            return String(s || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/'/g, "&#39;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
        window.esc = esc;

        function jsStr(s) {
            return String(s || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
        }
        window.jsStr = jsStr;

        window.deviceCache = {};
        window.deviceModalKey = "";

        function deviceChip(did) {
            return '<span class="key-expiry" style="display:inline-flex; align-items:center; gap:4px; margin-right:8px;" title="' + esc(did) + '"><svg class="svg-ic" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg> ' + esc(did.length > 12 ? did.slice(0, 12) + "..." : did) + '</span>';
        }
        window.deviceChip = deviceChip;

        function showDevices(key) {
            const ids = window.deviceCache[key] || [];
            if (!ids.length) { showToast("No devices bound yet!"); return; }
            window.deviceModalKey = key;
            const rows = ids.map(function(did) {
                return '<div style="display:flex; align-items:center; justify-content:space-between; gap:10px; background:rgba(255,255,255,0.04); border-radius:10px; padding:8px 12px; margin-bottom:6px;">' +
                    '<span style="font-size:11px; color:#94a3b8; font-family:monospace; word-break:break-all;">' + esc(did) + '</span>' +
                    '<button class="btn btn-red btn-small" style="flex-shrink:0;" onclick="unbindDevice(\'' + jsStr(key) + '\',\'' + jsStr(did) + '\')">RESET</button>' +
                    '</div>';
            }).join("");
            document.getElementById("modalBody").innerHTML =
                '<h3 style="display:flex; justify-content:space-between; align-items:center;">Devices (' + ids.length + ')<button class="btn btn-red btn-small" onclick="closeModal()">CLOSE</button></h3>' +
                '<div style="max-height:60vh; overflow-y:auto;">' + rows + '</div>';
            document.getElementById("modalOverlay").classList.add("show");
        }
        window.showDevices = showDevices;

        function loadKeys() {
            const list = document.getElementById("keysList");
            list.innerHTML = '<div class="empty-state">Loading...</div>';
            get(ref(db, "ActiveUserKeys")).then(function(snap) {
                list.innerHTML = "";
                if (!snap.exists()) {
                    list.innerHTML = '<div class="empty-state">No keys yet. Add one above.</div>';
                    return;
                }
                const keys = snap.val();
                Object.keys(keys).sort().forEach(function(key) {
                    const data = keys[key] || {};
                    const banned = !!data.banned;
                    let statusText, statusCls, expiryText, durationText;
                    const dur = data.durationHours;
                    if (dur) {
                        durationText = (dur === 99999) ? "Lifetime" : (dur + " Hours");
                        const expired = (dur !== 99999) && (data.createdAt > 0) && Date.now() > (data.createdAt + dur * 3600000);
                        statusText = banned ? "BANNED" : (expired ? "EXPIRED" : "ACTIVE");
                        statusCls = (banned || expired) ? "key-bad" : "key-good";
                        expiryText = (dur === 99999 || data.createdAt <= 0) ? "Lifetime"
                            : new Date(data.createdAt + dur * 3600000).toLocaleString("en-GB", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
                    } else {
                        durationText = "";
                        const expired = data.expiresAt > 0 && Date.now() > data.expiresAt;
                        statusText = banned ? "BANNED" : (expired ? "EXPIRED" : "ACTIVE");
                        statusCls = (banned || expired) ? "key-bad" : "key-good";
                        expiryText = data.expiresAt > 0
                            ? new Date(data.expiresAt).toLocaleString("en-GB", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" })
                            : "Never";
                    }
                const expiryMs = computeExpiryMs(data, dur);
                const type = data.type || "Normal";
                editTypeState = type;
                    const usedText = data.isUsed
                        ? '<span class="key-status" style="background:rgba(236,72,153,0.12); color:#ec4899; border:1px solid rgba(236,72,153,0.3);">USED</span>'
                        : '<span class="key-status" style="background:rgba(16,185,129,0.12); color:#10b981; border:1px solid rgba(16,185,129,0.3);">UNUSED</span>';
                    const typeText = '<span class="key-status" style="background:rgba(168,85,247,0.12); color:#a855f7; border:1px solid rgba(168,85,247,0.3);">' + esc(type.toUpperCase()) + '</span>';
                    const boundId = data.boundDeviceId && String(data.boundDeviceId) !== "NONE" && String(data.boundDeviceId) !== "none" ? String(data.boundDeviceId) : "";
                    const boundMap = data.boundDevices || {};
                    const allDeviceIds = [];
                    if (boundId) allDeviceIds.push(boundId);
                    Object.keys(boundMap).forEach(function(did) { if (did !== boundId) allDeviceIds.push(did); });
                    window.deviceCache[key] = allDeviceIds;
                    const shownChips = allDeviceIds.slice(0, 3).map(deviceChip);
                    const limitChip = '<span class="key-status" style="background:rgba(56,189,248,0.12); color:#38bdf8; border:1px solid rgba(56,189,248,0.3);"><svg class="svg-ic" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg> ' + allDeviceIds.length + '/' + (data.maxDevices ? data.maxDevices : "∞") + '</span>';
                    const name = data.note || data.name || "";
                    const item = document.createElement("div");
                    item.className = "list-item";
                    item.innerHTML =
                        '<div class="info"><div style="font-size: 20px;"><svg class="svg-ic" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.5 12.5 20 3M14 9l3 3M17.5 5.5l3 3"/></svg></div><div>' +
                        '<div class="t1">' + esc(key) + '</div>' +
                        '<div class="t2">' + esc(name || "-") + '</div>' +
                        '<div class="key-meta" style="display:flex; gap:8px; align-items:center; margin-top:4px; flex-wrap:wrap;">' +
                        '<span class="key-status ' + statusCls + '">' + statusText + '</span>' +
                        typeText + usedText + limitChip +
                        (durationText ? '<span class="key-expiry"><svg class="svg-ic" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#fb923c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> ' + esc(durationText) + '</span>' : '') +
                        '<span class="key-expiry">Expires: ' + esc(expiryText) + '</span>' +
                        (expiryMs > 0 ? '<span class="key-countdown" data-expiry="' + expiryMs + '"><svg class="svg-ic" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h14M5 22h14M6 2v5l6 5 6-5V2M6 22v-5l6-5 6 5v5"/></svg> ' + esc(remainingText(expiryMs)) + '</span>' : '') +
                        '</div>' +
                        (allDeviceIds.length ? '<div class="key-devices" style="margin-top:8px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;">' + shownChips.join("") +
                            (allDeviceIds.length > 3 ? '<button class="btn btn-small" style="padding:6px 10px; font-size:10px;" onclick="showDevices(\'' + jsStr(key) + '\')">+' + (allDeviceIds.length - 3) + ' MORE</button>' : '') +
                            '</div>' : '') +
                        '</div></div>' +
                        '<div class="actions">' +
                        (allDeviceIds.length ? '<button class="btn btn-small" onclick="showDevices(\'' + jsStr(key) + '\')">DEVICES (' + allDeviceIds.length + ')</button>' : '') +
                        '<button class="btn btn-small ' + (banned ? "btn-green" : "btn-red") + '" onclick="toggleBan(\'' + jsStr(key) + '\')">' + (banned ? "UNBAN" : "BAN") + '</button>' +
                        '<button class="btn btn-small" onclick="editKey(\'' + jsStr(key) + '\')">EDIT</button>' +
                        '<button class="btn btn-red btn-small" onclick="deleteKey(\'' + jsStr(key) + '\')">DELETE</button>' +
                        '</div>';
                    list.appendChild(item);
                });
            }).catch(function() {
                list.innerHTML = '<div class="empty-state">Error loading keys.</div>';
            });
        }
        window.loadKeys = loadKeys;

        function computeExpiryMs(data, dur) {
            if (dur) {
                if (dur === 99999 || !data.createdAt || data.createdAt <= 0) return 0;
                return data.createdAt + dur * 3600000;
            }
            if (data.expiresAt && data.expiresAt > 0) return data.expiresAt;
            return 0;
        }

        function remainingText(ms) {
            const diff = ms - Date.now();
            if (diff <= 0) return "Expired";
            const s = Math.floor(diff / 1000);
            const d = Math.floor(s / 86400);
            const h = Math.floor((s % 86400) / 3600);
            const m = Math.floor((s % 3600) / 60);
            const sec = s % 60;
            if (d > 0) return d + "d " + h + "h " + m + "m " + sec + "s";
            if (h > 0) return h + "h " + m + "m " + sec + "s";
            if (m > 0) return m + "m " + sec + "s";
            return sec + "s";
        }

        function updateCountdowns() {
            document.querySelectorAll(".key-countdown").forEach(function(el) {
                const exp = parseInt(el.getAttribute("data-expiry"), 10);
                if (!exp) return;
                if (Date.now() >= exp) {
                    el.innerText = "⏳ Expired";
                    const item = el.closest(".list-item");
                    if (item) {
                        const st = item.querySelector(".key-status.key-good");
                        if (st) { st.textContent = "EXPIRED"; st.className = "key-status key-bad"; }
                    }
                } else {
                    el.innerText = "⏳ " + remainingText(exp);
                }
            });
        }
        setInterval(updateCountdowns, 1000);
        window.computeExpiryMs = computeExpiryMs;
        window.remainingText = remainingText;

        let addDurationState = { mode: "preset", hours: 99999 };

        const KEY_DURATION_OPTIONS = [
            { hours: 99999, label: "Lifetime" },
            { hours: 24, label: "24 Hours" },
            { hours: 48, label: "48 Hours" },
            { hours: 72, label: "3 Days" },
            { hours: 168, label: "7 Days" },
            { hours: 720, label: "30 Days" },
            { hours: 0, label: "Custom Hours..." }
        ];

        function toggleAddDurationDropdown() {
            const menu = document.getElementById("addDurationMenu");
            const wrap = menu.parentElement;
            if (wrap.classList.contains("open")) {
                wrap.classList.remove("open");
                return;
            }
            closeAddTypeDropdown();
            closeEditTypeDropdown();
            closeAddLimitDropdown();
            closeEditLimitDropdown();
            menu.innerHTML = "";
            KEY_DURATION_OPTIONS.forEach(function(opt) {
                let isSel;
                if (opt.hours === 0) {
                    isSel = addDurationState.mode === "custom";
                } else {
                    isSel = addDurationState.mode === "preset" && addDurationState.hours === opt.hours;
                }
                const item = document.createElement("div");
                item.className = "cs-option" + (isSel ? " selected" : "");
                item.innerHTML =
                    '<span class="cs-opt-name">' + esc(opt.label) + '</span>' +
                    '<span class="cs-opt-check">' + (isSel ? "✓" : "") + '</span>';
                item.addEventListener("click", function() {
                    if (opt.hours === 0) {
                        addDurationState = { mode: "custom", hours: 0 };
                        document.getElementById("keyDurationCustom").focus();
                    } else {
                        addDurationState = { mode: "preset", hours: opt.hours };
                    }
                    document.getElementById("addDurationValue").innerText = opt.label;
                    document.getElementById("addDurationCustomWrap").style.display = (opt.hours === 0) ? "block" : "none";
                    wrap.classList.remove("open");
                });
                menu.appendChild(item);
            });
            wrap.classList.add("open");
        }
        window.toggleAddDurationDropdown = toggleAddDurationDropdown;

        function closeAddDurationDropdown() {
            const menu = document.getElementById("addDurationMenu");
            if (menu) menu.parentElement.classList.remove("open");
        }
        window.closeAddDurationDropdown = closeAddDurationDropdown;

        let addTypeState = "Normal";
        let editTypeState = "Normal";

        const KEY_TYPE_OPTIONS = [
            { value: "Normal", label: "Normal", icon: '<svg class="svg-ic" viewBox="0 0 24 24" width="14" height="14" fill="#fbbf24" stroke="none"><path d="M12 2l2.9 6.26 6.6.57-5 4.35 1.5 6.47L12 16.9l-6 3.75 1.5-6.47-5-4.35 6.6-.57z"/></svg>' },
            { value: "VIP", label: "VIP", icon: '<svg class="svg-ic" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16V6l4 4 4-6 4 6 4-4v10z"/><path d="M4 20h16"/></svg>' }
        ];

        function renderTypeMenu(menuId, state, onPick) {
            const menu = document.getElementById(menuId);
            if (!menu) return;
            menu.innerHTML = "";
            KEY_TYPE_OPTIONS.forEach(function(opt) {
                const isSel = state === opt.value;
                const item = document.createElement("div");
                item.className = "cs-option" + (isSel ? " selected" : "");
                item.innerHTML =
                    '<span class="cs-opt-name">' + opt.icon + ' ' + esc(opt.label) + '</span>' +
                    '<span class="cs-opt-check">' + (isSel ? "✓" : "") + '</span>';
                item.addEventListener("click", function() {
                    onPick(opt);
                    menu.parentElement.classList.remove("open");
                });
                menu.appendChild(item);
            });
        }

        function toggleAddTypeDropdown() {
            const menu = document.getElementById("addTypeMenu");
            if (!menu) return;
            const wrap = menu.parentElement;
            if (wrap.classList.contains("open")) {
                wrap.classList.remove("open");
                return;
            }
            closeAddDurationDropdown();
            closeEditTypeDropdown();
            closeAddLimitDropdown();
            closeEditLimitDropdown();
            renderTypeMenu("addTypeMenu", addTypeState, function(opt) {
                addTypeState = opt.value;
                document.getElementById("addTypeValue").innerText = opt.label;
            });
            wrap.classList.add("open");
        }
        window.toggleAddTypeDropdown = toggleAddTypeDropdown;

        function closeAddTypeDropdown() {
            const menu = document.getElementById("addTypeMenu");
            if (menu) menu.parentElement.classList.remove("open");
        }
        window.closeAddTypeDropdown = closeAddTypeDropdown;

        function getAddType() { return addTypeState; }

        const KEY_LIMIT_OPTIONS = [
            { value: 0, label: "Unlimited" },
            { value: 1, label: "1 Device" },
            { value: 2, label: "2 Devices" },
            { value: 3, label: "3 Devices" },
            { value: 5, label: "5 Devices" }
        ];

        let addLimitState = 0;
        let editLimitState = 0;

        function limitLabel(v) {
            const vn = parseInt(v, 10) || 0;
            const opt = KEY_LIMIT_OPTIONS.find(function(o) { return o.value === vn; });
            return opt ? opt.label : (vn + " Devices");
        }

        function renderLimitMenu(menuId, state, onPick) {
            const menu = document.getElementById(menuId);
            if (!menu) return;
            menu.innerHTML = "";
            KEY_LIMIT_OPTIONS.forEach(function(opt) {
                const isSel = state === opt.value;
                const item = document.createElement("div");
                item.className = "cs-option" + (isSel ? " selected" : "");
                item.innerHTML =
                    '<span class="cs-opt-name"><svg class="svg-ic" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg> ' + esc(opt.label) + '</span>' +
                    '<span class="cs-opt-check">' + (isSel ? "✓" : "") + '</span>';
                item.addEventListener("click", function() {
                    onPick(opt);
                    menu.parentElement.classList.remove("open");
                });
                menu.appendChild(item);
            });
        }

        function toggleAddLimitDropdown() {
            const menu = document.getElementById("addLimitMenu");
            if (!menu) return;
            const wrap = menu.parentElement;
            if (wrap.classList.contains("open")) {
                wrap.classList.remove("open");
                return;
            }
            closeAddDurationDropdown();
            closeAddTypeDropdown();
            closeEditTypeDropdown();
            closeEditLimitDropdown();
            renderLimitMenu("addLimitMenu", addLimitState, function(opt) {
                addLimitState = opt.value;
                document.getElementById("addLimitValue").innerText = opt.label;
            });
            wrap.classList.add("open");
        }
        window.toggleAddLimitDropdown = toggleAddLimitDropdown;

        function closeAddLimitDropdown() {
            const menu = document.getElementById("addLimitMenu");
            if (menu) menu.parentElement.classList.remove("open");
        }
        window.closeAddLimitDropdown = closeAddLimitDropdown;

        function toggleEditLimitDropdown() {
            const menu = document.getElementById("mLimitMenu");
            if (!menu) return;
            const wrap = menu.parentElement;
            if (wrap.classList.contains("open")) {
                wrap.classList.remove("open");
                return;
            }
            closeAddDurationDropdown();
            closeAddTypeDropdown();
            closeEditTypeDropdown();
            closeAddLimitDropdown();
            renderLimitMenu("mLimitMenu", editLimitState, function(opt) {
                editLimitState = opt.value;
                document.getElementById("mLimitValue").innerText = opt.label;
            });
            wrap.classList.add("open");
        }
        window.toggleEditLimitDropdown = toggleEditLimitDropdown;

        function closeEditLimitDropdown() {
            const menu = document.getElementById("mLimitMenu");
            if (menu) menu.parentElement.classList.remove("open");
        }
        window.closeEditLimitDropdown = closeEditLimitDropdown;

        function getAddLimit() { return addLimitState; }

        function toggleEditTypeDropdown() {
            const menu = document.getElementById("mTypeMenu");
            if (!menu) return;
            const wrap = menu.parentElement;
            if (wrap.classList.contains("open")) {
                wrap.classList.remove("open");
                return;
            }
            closeAddDurationDropdown();
            closeAddTypeDropdown();
            closeAddLimitDropdown();
            closeEditLimitDropdown();
            renderTypeMenu("mTypeMenu", editTypeState, function(opt) {
                editTypeState = opt.value;
                document.getElementById("mTypeValue").innerText = opt.label;
            });
            wrap.classList.add("open");
        }
        window.toggleEditTypeDropdown = toggleEditTypeDropdown;

        function closeEditTypeDropdown() {
            const menu = document.getElementById("mTypeMenu");
            if (menu) menu.parentElement.classList.remove("open");
        }
        window.closeEditTypeDropdown = closeEditTypeDropdown;

        document.addEventListener("click", function(e) {
            if (!e.target.closest(".custom-select")) {
                closeAddDurationDropdown();
                closeAddTypeDropdown();
                closeEditTypeDropdown();
                closeAddLimitDropdown();
                closeEditLimitDropdown();
            }
        });

        function getAddDurationHours() {
            if (addDurationState.mode === "custom") {
                const val = parseInt(document.getElementById("keyDurationCustom").value, 10);
                if (!val || val <= 0) { showToast("Enter a valid duration in hours!", true); return -1; }
                return val;
            }
            return addDurationState.hours;
        }

        function randomKey() {
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ0123456789";
            let s = "PH-";
            for (let i = 0; i < 6; i++) s += chars.charAt(Math.floor(Math.random() * chars.length));
            document.getElementById("keyInput").value = s;
        }
        window.randomKey = randomKey;

        function addKey() {
            const key = document.getElementById("keyInput").value.trim();
            const note = document.getElementById("keyNameInput").value.trim();
            const type = getAddType();
            if (!key) { showToast("Key is required!", true); return; }
            const durationHours = getAddDurationHours();
            if (durationHours === -1) return;
            set(ref(db, "ActiveUserKeys/" + key), {
                createdAt: Date.now(),
                durationHours: durationHours,
                maxDevices: getAddLimit(),
                isUsed: false,
                boundDeviceId: "NONE",
                type: type,
                note: note,
                banned: false
            })
                .then(function() {
                    showToast("Key saved!");
                    document.getElementById("keyInput").value = "";
                    document.getElementById("keyNameInput").value = "";
                    document.getElementById("keyDurationCustom").value = "";
                    addDurationState = { mode: "preset", hours: 99999 };
                    document.getElementById("addDurationValue").innerText = "Lifetime";
                    document.getElementById("addDurationCustomWrap").style.display = "none";
                    addLimitState = 0;
                    document.getElementById("addLimitValue").innerText = "Unlimited";
                    loadKeys();
                })
                .catch(function() { showToast("Error saving key!", true); });
        }
        window.addKey = addKey;

        function toggleBan(key) {
            get(ref(db, "ActiveUserKeys/" + key)).then(function(snap) {
                const data = snap.val() || {};
                const banned = !data.banned;
                update(ref(db, "ActiveUserKeys/" + key), { banned: banned }).then(function() {
                    showToast(banned ? "Key banned!" : "Key unbanned!");
                    loadKeys();
                }).catch(function() { showToast("Error!", true); });
            });
        }
        window.toggleBan = toggleBan;

        function unbindDevice(key, deviceId) {
            if (!confirm("Unbind device " + deviceId + " from this key? It can log in again only if unused.")) return;
            const updates = {};
            updates["ActiveUserKeys/" + key + "/boundDeviceId"] = "NONE";
            updates["ActiveUserKeys/" + key + "/isUsed"] = false;
            updates["ActiveUserKeys/" + key + "/boundDevices/" + deviceId] = null;
            update(ref(db), updates).then(function() {
                showToast("Device unbound!");
                loadKeys();
                if (window.deviceModalKey && document.getElementById("modalOverlay").classList.contains("show")) {
                    showDevices(window.deviceModalKey);
                }
            }).catch(function() { showToast("Error!", true); });
        }
        window.unbindDevice = unbindDevice;

        function editKey(key) {
            get(ref(db, "ActiveUserKeys/" + key)).then(function(snap) {
                const data = snap.val() || {};
                const type = data.type || "Normal";
                editTypeState = type;
                editLimitState = parseInt(data.maxDevices, 10) || 0;
                const dur = data.durationHours || 24;
                const boundId = data.boundDeviceId && String(data.boundDeviceId) !== "NONE" && String(data.boundDeviceId) !== "none" ? String(data.boundDeviceId) : "";
                const boundMap = data.boundDevices || {};
                const allDeviceIds = [];
                if (boundId) allDeviceIds.push(boundId);
                Object.keys(boundMap).forEach(function(did) { if (did !== boundId) allDeviceIds.push(did); });
                window.deviceCache[key] = allDeviceIds;
                document.getElementById("modalBody").innerHTML =
                    '<h3>Edit Key: ' + esc(key) + '</h3>' +
                    '<div class="form-row"><div><label>User Name / Note</label><input type="text" id="mKeyNote" value="' + esc(data.note || data.name || "") + '"></div></div>' +
                    '<div class="form-row"><div><label>Type</label><div class="custom-select">' +
                    '<button type="button" class="cs-trigger" onclick="toggleEditTypeDropdown()">' +
                    '<span class="cs-value" id="mTypeValue">' + esc(type) + '</span>' +
                    '<span class="cs-arrow">▾</span></button>' +
                    '<div class="cs-menu" id="mTypeMenu"></div></div></div></div>' +
                    '<div class="form-row"><div><label>Duration (hours)</label><input type="number" id="mKeyDuration" value="' + dur + '" min="1"><div class="field-hint">Use <b>99999</b> for lifetime.</div></div></div>' +
                    '<div class="form-row"><div><label>Device Limit</label><div class="custom-select">' +
                    '<button type="button" class="cs-trigger" onclick="toggleEditLimitDropdown()">' +
                    '<span class="cs-value" id="mLimitValue">' + esc(limitLabel(data.maxDevices)) + '</span>' +
                    '<span class="cs-arrow">▾</span></button>' +
                    '<div class="cs-menu" id="mLimitMenu"></div></div></div></div>' +
                    (allDeviceIds.length ? '<div style="margin-bottom:14px;"><label>Bound Devices (' + allDeviceIds.length + ')</label>' +
                        '<div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;">' + allDeviceIds.slice(0, 5).map(deviceChip).join("") +
                        (allDeviceIds.length > 5 ? '<span class="key-expiry">+' + (allDeviceIds.length - 5) + ' more</span>' : '') +
                        '</div>' +
                        '<button class="btn btn-small" onclick="showDevices(\'' + jsStr(key) + '\')">VIEW ALL DEVICES</button></div>' : '') +
                    '<div style="display: flex; gap: 10px; justify-content: flex-end;">' +
                    '<button class="btn btn-red btn-small" onclick="closeModal()">CANCEL</button>' +
                    '<button class="btn btn-small" onclick="saveKeyEdit(\'' + jsStr(key) + '\')">SAVE</button></div>';
                document.getElementById("modalOverlay").classList.add("show");
            });
        }
        window.editKey = editKey;

        function saveKeyEdit(key) {
            const note = document.getElementById("mKeyNote").value.trim();
            const type = editTypeState;
            const durationHours = parseInt(document.getElementById("mKeyDuration").value, 10);
            if (!durationHours || durationHours <= 0) { showToast("Duration must be > 0 hours!", true); return; }
            update(ref(db, "ActiveUserKeys/" + key), { note: note, type: type, durationHours: durationHours, maxDevices: editLimitState }).then(function() {
                showToast("Key updated!");
                closeModal();
                loadKeys();
            }).catch(function() { showToast("Error!", true); });
        }
        window.saveKeyEdit = saveKeyEdit;

        function deleteKey(key) {
            if (!confirm("Delete key " + key + "?")) return;
            remove(ref(db, "ActiveUserKeys/" + key)).then(function() {
                showToast("Key deleted!");
                loadKeys();
            }).catch(function() { showToast("Error!", true); });
        }
        window.deleteKey = deleteKey;

        function clearExpiredKeys() {
            get(ref(db, "ActiveUserKeys")).then(function(snap) {
                if (!snap.exists()) { showToast("No keys to clean!"); return; }
                const keys = snap.val();
                const now = Date.now();
                const expired = [];
                Object.keys(keys).forEach(function(key) {
                    const data = keys[key] || {};
                    const dur = data.durationHours;
                    let isExpired = false;
                    if (dur) {
                        if (dur !== 99999 && data.createdAt > 0) isExpired = now > (data.createdAt + dur * 3600000);
                    } else {
                        isExpired = data.expiresAt > 0 && now > data.expiresAt;
                    }
                    if (isExpired) expired.push(key);
                });
                if (!expired.length) { showToast("No expired keys!"); return; }
                if (!confirm("Delete " + expired.length + " expired key(s)?")) return;
                const updates = {};
                expired.forEach(function(key) { updates["ActiveUserKeys/" + key] = null; });
                update(ref(db), updates).then(function() {
                    showToast(expired.length + " expired key(s) deleted!");
                    loadKeys();
                }).catch(function() { showToast("Error!", true); });
            }).catch(function() { showToast("Error loading keys!", true); });
        }
        window.clearExpiredKeys = clearExpiredKeys;

        function closeModal() {
            window.deviceModalKey = "";
            document.getElementById("modalOverlay").classList.remove("show");
        }
        window.closeModal = closeModal;

        document.getElementById("modalOverlay").addEventListener("click", function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
